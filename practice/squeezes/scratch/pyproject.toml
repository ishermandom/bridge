# Scratch prototype of the squeeze trainer backend — see ../spec.md. A uv
# workspace member so it shares the repo lockfile and environment.

[project]
name = "squeezes-scratch"
version = "0.1.0"
description = "Prototype squeeze-play trainer: quantum-defender engine + API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.30",
]

[tool.uv]
package = false
