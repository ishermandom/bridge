# Scratch prototype of the squeeze trainer backend — see ../spec.md. A uv
# workspace member so it shares the repo lockfile and environment.

[project]
name = "squeezes-scratch"
version = "0.1.0"
description = "Prototype squeeze-play trainer: quantum-defender engine + API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.30",
]

# `fastapi.testclient.TestClient` imports httpx at runtime, and fastapi does
# not depend on it, so server_test.py needs it declared here.
#
# TODO: Starlette's test client warns on every run that `httpx` is deprecated
#   there in favor of `httpx2`, a separate distribution. Switch once the test
#   client is confirmed to work against it.
[dependency-groups]
dev = ["httpx"]

[tool.uv]
package = false
