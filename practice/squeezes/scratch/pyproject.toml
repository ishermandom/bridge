# Scratch prototype of the squeeze trainer backend — see ../spec.md. A uv
# workspace member so it shares the repo lockfile and environment.

[project]
name = "squeezes-scratch"
version = "0.1.0"
description = "Prototype squeeze-play trainer: quantum-defender engine + API"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2",
  "uvicorn>=0.30",
]

# Starlette's test client, which `fastapi.testclient.TestClient` wraps, imports
# httpx2 at runtime, and fastapi does not depend on it, so server_test.py needs
# it declared here.
[dependency-groups]
dev = ["httpx2"]

[tool.uv]
package = false
