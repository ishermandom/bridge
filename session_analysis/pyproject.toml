[project]
name = "session-analysis"
version = "0.0.0"
description = "Digitizing handwritten bridge scoresheets and analyzing the session."
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "pillow>=11",
  "playwright>=1.62",
  "pydantic>=2",
  # Unwraps the image a scanner app's PDF holds; Pillow only writes PDFs.
  "pypdf",
]

[tool.uv]
package = false
