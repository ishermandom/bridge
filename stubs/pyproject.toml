[project]
# Named after the import directory it ships, the way stub distributions from
# outside typeshed are named (pandas-stubs, lxml-stubs): the typing spec's
# "Distributing type information" chapter keeps `types-*` for typeshed's own.
name = "pypdfium2-stubs"
version = "0.1.0"
description = "Minimal local type stubs for the pypdfium2 API this repo uses."

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Type checkers resolve the stubs only under the exact `<package>-stubs`
# spelling — the naming requirement in the same spec chapter.
packages = ["pypdfium2-stubs"]

[tool.setuptools.package-data]
"pypdfium2-stubs" = ["*.pyi"]
