[project]
# Named for its import directory, like the pypdfium2 distribution beside it —
# see ../pypdfium2/pyproject.toml for the naming rationale.
name = "fonttools-stubs"
version = "0.1.0"
description = "Minimal local type stubs for the fontTools API this repo uses."

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The `<package>-stubs` spelling — matching the import name's case, so
# `fontTools`, not the distribution's lowercase — is what lets type checkers
# resolve the stubs.
packages = ["fontTools-stubs"]

[tool.setuptools.package-data]
"fontTools-stubs" = ["*.pyi"]
