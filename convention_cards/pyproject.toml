[project]
name = "convention-cards"
version = "0.0.0"
description = "Tools for printing bridge convention cards."
requires-python = ">=3.14"
dependencies = [
  "pillow",
  "playwright",
  "pypdf",
  "pypdfium2",
  "reportlab",
  "streamlit",
]

[dependency-groups]
dev = [
  # Reads glyph metrics for the palette specimen's symbol sizing.
  "fonttools",
  # The type stubs below install with the dev tools.
  { include-group = "types" },
]
# Stubs for dependencies that ship no type information of their own. The
# repo's own stub packages (stubs/*, see the README there) are named
# `*-stubs`; typeshed's published ones are named `types-*`.
types = [
  "fonttools-stubs",
  "pypdfium2-stubs",
  "types-reportlab",
]

[tool.uv]
package = false

[tool.uv.sources]
# Editable, so an edited stub takes effect on the next check without a
# reinstall — see ../stubs/README.md.
fonttools-stubs = { path = "../stubs/fonttools", editable = true }
pypdfium2-stubs = { path = "../stubs/pypdfium2", editable = true }
