[package]
name = "suit_combinations"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Finds and explains the best play of a bridge suit combination"
publish = false

[dependencies]
# Reads the flashcards' input file, whose cells may hold quoted line breaks.
csv = "1"
# A faster hash than the standard library's for the solver's caches, whose
# keys never come from untrusted input.
rustc-hash = "2"

# The tests solve real combinations, some by brute force, which unoptimized
# code runs many times slower. Tests keep the overflow checks and debug
# assertions they would otherwise have.
[profile.test]
# Every optimization: the level release builds use by default.
opt-level = 3
