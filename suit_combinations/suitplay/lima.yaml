#
# A small Debian machine that runs SuitPlay, a Windows program, as a local
# reference for the analyzer's percentages. Lima creates and runs it;
# `setup.sh` installs what SuitPlay needs.
base: template:debian-13
cpus: 2
memory: "2GiB"
# A ceiling, not a reservation: the disk file on the Mac grows only as the
# machine writes, and Debian's weekly `fstrim` hands freed space back.
disk: "8GiB"
# No shared folders: files move in and out with `limactl copy`.
mounts: []
# Lima's bundled container engine isn't needed, and would cost disk space.
containerd:
  system: false
  user: false
# Nothing in the machine serves the Mac, so no ports are forwarded.
portForwards:
  - guestIP: "0.0.0.0"
    proto: any
    ignore: true
provision:
  - mode: system
    file: setup.sh
  - mode: user
    file: wine_prefix.sh
