[project]
name = "system-notes"
version = "0.0.0"
description = "Renders partnership system notes to HTML, PDF, and plain text."
requires-python = ">=3.15"
dependencies = [
  # WeasyPrint's own HTML parser, which print_layout.py parses the rendered
  # HTML with; spec.md #section-packing says why that matters.
  "tinyhtml5",
  # Releases before 70 free their Fontconfig config twice, so Python's garbage
  # collector can crash the process while freeing a Pango font map (WeasyPrint
  # issue #2843).
  "weasyprint>=70",
]

[dependency-groups]
dev = [
  # The tests read heading pages from the PDF's bookmarks through pypdf; the
  # renderer itself does not need it.
  "pypdf",
  # The tests measure the installed fonts through fontTools: the body font's
  # digit widths, and the list markers' outlines.
  "fonttools",
  # The tests read the list-marker rules from the stylesheet through tinycss2,
  # the CSS parser WeasyPrint itself uses.
  "tinycss2",
  # The type stubs below install with the dev tools.
  { include-group = "types" },
]
# Stubs for dependencies that ship no type information of their own, from the
# repo's stub packages (../stubs, see the README there).
types = [
  "fonttools-stubs",
  "tinycss2-stubs",
  "tinyhtml5-stubs",
  "weasyprint-stubs",
]

[tool.uv]
package = false

[tool.uv.sources]
# Editable, so an edited stub takes effect on the next check without a
# reinstall — see ../stubs/README.md.
fonttools-stubs = { path = "../stubs/fonttools", editable = true }
tinycss2-stubs = { path = "../stubs/tinycss2", editable = true }
tinyhtml5-stubs = { path = "../stubs/tinyhtml5", editable = true }
weasyprint-stubs = { path = "../stubs/weasyprint", editable = true }
